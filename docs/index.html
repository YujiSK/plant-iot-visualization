<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0c4a24;
      --bg2: #166534;
    }

    /* ── Page ── */
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      transition: background 0.7s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Glass card ── */
    .card {
      width: min(400px, 100%);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 32px 24px 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    /* ── Plant title ── */
    .plant-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Score ── */
    .score-section {
      margin-bottom: 28px;
    }

    .score-number {
      font-size: clamp(80px, 22vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      padding: 6px 16px 6px 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
    }

    /* ── Sensor tiles ── */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sensor-tile {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 12px 14px;
    }

    .sensor-value {
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sensor-unit {
      font-size: clamp(16px, 4.5vw, 21px);
      font-weight: 500;
      opacity: 0.8;
      margin-left: 1px;
    }

    .sensor-label {
      margin-top: 5px;
      font-size: clamp(11px, 3vw, 13px);
      opacity: 0.65;
      letter-spacing: 0.07em;
    }

    /* ── Message ── */
    .message {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      line-height: 1.55;
      opacity: 0.92;
    }

    /* ── Loading / error ── */
    .state-msg {
      font-size: clamp(17px, 5vw, 22px);
      opacity: 0.8;
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="card" class="card" aria-live="polite">
    <div class="plant-title">🌿 バジルの状態</div>
    <div class="state-msg">
      <span class="spinner"></span>読み込み中…
    </div>
  </div>

  <div id="footer" class="footer"></div>

  <script src="config.js"></script>
  <script>
    const BASE = (window.PLANT_CONFIG?.SUPABASE_URL || "").replace(/\/$/, "");
    const KEY  = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    if (!BASE || !KEY) {
      showState("設定が見つかりません");
    }

    /* ─ Status theme ─ */
    const THEMES = {
      good:    { bg1: "#0c4a24", bg2: "#166534", label: "良好"   },
      caution: { bg1: "#451a03", bg2: "#78350f", label: "注意"   },
      alert:   { bg1: "#450a0a", bg2: "#7f1d1d", label: "要対応" },
    };

    function theme(score) {
      if (score >= 80) return THEMES.good;
      if (score >= 60) return THEMES.caution;
      return THEMES.alert;
    }

    /* ─ Helpers ─ */
    function toJst(utcStr) {
      const d = new Date(new Date(utcStr).getTime() + 9 * 3600 * 1000);
      return d.toLocaleString("ja-JP", { hour12: false });
    }

    function fmt(v, d = 1) {
      return v != null ? Number(v).toFixed(d) : "--";
    }

    function setBackground(t) {
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
    }

    function showState(msg) {
      document.getElementById("card").innerHTML =
        `<div class="plant-title">🌿 バジルの状態</div>
         <div class="state-msg">${msg}</div>`;
      document.getElementById("footer").innerHTML = "";
    }

    /* ─ Render ─ */
    function render(d) {
      const score = d.vitality_score ?? 0;
      const t     = theme(score);
      setBackground(t);

      document.getElementById("card").innerHTML = `
        <div class="plant-title">🌿 バジルの状態</div>

        <div class="score-section">
          <div class="score-number">${score}</div>
          <div class="status-chip">
            <span class="status-dot"></span>${t.label}
          </div>
        </div>

        <div class="sensors">
          <div class="sensor-tile">
            <div class="sensor-value">${fmt(d.temperature)}<span class="sensor-unit">℃</span></div>
            <div class="sensor-label">温度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value">${fmt(d.humidity)}<span class="sensor-unit">%</span></div>
            <div class="sensor-label">湿度</div>
          </div>
        </div>

        <div class="message">${d.message || "状態不明"}</div>
      `;

      document.getElementById("footer").innerHTML =
        `最終更新：<strong>${toJst(d.created_at)}</strong><br>10秒ごとに自動更新`;
    }

    /* ─ Fetch ─ */
    async function loadData() {
      if (!BASE || !KEY) return;
      try {
        const res = await fetch(
          `${BASE}/rest/v1/sensor_logs` +
          `?select=temperature,humidity,pressure,vitality_score,message,created_at` +
          `&order=created_at.desc&limit=1`,
          { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { showState("データがありません"); return; }
        render(rows[0]);
      } catch (e) {
        showState("データ取得失敗");
        console.error(e);
      }
    }

    loadData();
    setInterval(loadData, 10_000);
  </script>
</body>
</html>
