<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --accent: #16a34a;
      --bg-top: #edf7ef;
      --bg-bot: #f5f7f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bot));
      color: #1a1f1b;
      padding: 24px 16px;
      transition: background 0.6s ease;
    }

    .container {
      width: min(520px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(26px, 6vw, 38px);
      letter-spacing: 0.03em;
      font-weight: 700;
    }

    /* ── Status card ── */
    .card {
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
      padding: 28px 24px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      transition: background 0.5s ease;
      position: relative;
    }

    /* Vitality score badge */
    .vitality-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 40px;
      padding: 6px 18px;
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 600;
      margin-bottom: 18px;
      letter-spacing: 0.04em;
    }

    .vitality-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* Sensor rows */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sensor-box {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 14px 10px 12px;
    }

    .sensor-label {
      font-size: clamp(11px, 2.5vw, 13px);
      opacity: 0.85;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    .sensor-value {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 700;
      line-height: 1;
    }

    .sensor-unit {
      font-size: clamp(13px, 3vw, 16px);
      opacity: 0.85;
      margin-left: 2px;
    }

    /* Message row */
    .message-row {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 0;
    }

    /* Loading / error states */
    .state-message {
      font-size: clamp(18px, 5vw, 24px);
      padding: 24px 0;
      opacity: 0.9;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.8;
    }

    .updated-time {
      font-weight: 600;
      color: #374151;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🌿 バジルの状態</h1>

    <div id="card" class="card" aria-live="polite">
      <div class="state-message">
        <span class="spinner"></span>読み込み中…
      </div>
    </div>

    <div class="footer">
      <span id="updated-at"></span>
      <br>10秒ごとに自動更新
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const SUPABASE_URL = window.PLANT_CONFIG?.SUPABASE_URL || "";
    const SUPABASE_KEY = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    if (!SUPABASE_URL || !SUPABASE_KEY) {
      document.getElementById("card").innerHTML =
        '<div class="state-message">設定が見つかりません</div>';
      throw new Error("PLANT_CONFIG is missing");
    }

    function toJst(utcString) {
      const utc = new Date(utcString);
      const jst = new Date(utc.getTime() + 9 * 60 * 60 * 1000);
      return jst.toLocaleString("ja-JP", { hour12: false });
    }

    function vitalityInfo(score) {
      if (score >= 80) return { color: "#16a34a", label: "良好", bgTop: "#edf7ef" };
      if (score >= 60) return { color: "#d97706", label: "注意", bgTop: "#fef9ec" };
      return { color: "#dc2626", label: "要対応", bgTop: "#fef2f2" };
    }

    function fmt(val, digits = 1) {
      return val != null ? Number(val).toFixed(digits) : "--";
    }

    function renderCard(d) {
      const score = d.vitality_score ?? 0;
      const info = vitalityInfo(score);
      const card = document.getElementById("card");

      card.style.background = info.color;
      document.documentElement.style.setProperty("--bg-top", info.bgTop);

      card.innerHTML = `
        <div class="vitality-badge">
          <span class="vitality-dot"></span>
          活力スコア ${score} &nbsp;·&nbsp; ${info.label}
        </div>
        <div class="sensors">
          <div class="sensor-box">
            <div class="sensor-label">温度</div>
            <div class="sensor-value">${fmt(d.temperature)}<span class="sensor-unit">℃</span></div>
          </div>
          <div class="sensor-box">
            <div class="sensor-label">湿度</div>
            <div class="sensor-value">${fmt(d.humidity)}<span class="sensor-unit">%</span></div>
          </div>
        </div>
        <div class="message-row">${d.message ?? "状態不明"}</div>
      `;

      const updatedEl = document.getElementById("updated-at");
      updatedEl.innerHTML =
        `最終更新：<span class="updated-time">${toJst(d.created_at)}</span>`;
    }

    async function loadData() {
      try {
        const url =
          `${SUPABASE_URL.replace(/\/$/, "")}/rest/v1/sensor_logs` +
          `?select=temperature,humidity,pressure,vitality_score,message,created_at` +
          `&order=created_at.desc&limit=1`;

        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const rows = await res.json();
        if (!rows.length) {
          document.getElementById("card").innerHTML =
            '<div class="state-message">データがありません</div>';
          return;
        }

        renderCard(rows[0]);
      } catch (err) {
        document.getElementById("card").innerHTML =
          '<div class="state-message">データ取得失敗</div>';
        document.getElementById("updated-at").textContent = "";
        console.error(err);
      }
    }

    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
