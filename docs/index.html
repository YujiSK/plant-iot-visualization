<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0c4a24;
      --bg2: #166534;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      transition: background 0.7s ease;
      -webkit-font-smoothing: antialiased;
    }

    .dashboard {
      width: min(860px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 400px);
      gap: 16px;
      justify-content: center;
      align-items: start;
    }

    @media (min-width: 860px) {
      .dashboard {
        grid-template-columns: minmax(0, 400px) minmax(320px, 400px);
      }
    }

    /* ── Glass card ── */
    .card,
    .doctor-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }

    .card {
      padding: 32px 24px 28px;
      text-align: center;
    }

    .doctor-card {
      padding: 26px 22px 22px;
      text-align: left;
    }

    .plant-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Score ── */
    .score-section {
      margin-bottom: 28px;
    }

    .score-number {
      font-size: clamp(80px, 22vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      padding: 6px 16px 6px 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* ── Sensor tiles ── */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sensor-tile {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 12px 14px;
    }

    .sensor-value {
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sensor-unit {
      font-size: clamp(16px, 4.5vw, 21px);
      font-weight: 500;
      opacity: 0.8;
      margin-left: 1px;
    }

    .sensor-label {
      margin-top: 5px;
      font-size: clamp(11px, 3vw, 13px);
      opacity: 0.65;
      letter-spacing: 0.07em;
    }

    .sensor-detail {
      margin-top: 4px;
      font-size: clamp(10px, 2.8vw, 12px);
      opacity: 0.55;
    }

    .status-value {
      font-size: clamp(24px, 7vw, 32px);
      letter-spacing: 0;
    }

    /* ── Message ── */
    .message {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      line-height: 1.55;
      opacity: 0.92;
    }

    /* ── Plant Doctor ── */
    .doctor-title {
      font-size: clamp(17px, 4vw, 20px);
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .doctor-section {
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    .doctor-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .doctor-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      opacity: 0.74;
    }

    .level-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      flex: 0 0 auto;
    }

    .level-dot.good { background: #86efac; }
    .level-dot.warning { background: #facc15; }
    .level-dot.danger { background: #f87171; }

    .doctor-list {
      display: grid;
      gap: 7px;
      list-style: none;
    }

    .doctor-row {
      display: grid;
      gap: 4px;
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      line-height: 1.45;
    }

    .doctor-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 750;
    }

    .doctor-value {
      opacity: 0.72;
      font-weight: 650;
      white-space: nowrap;
    }

    .doctor-comment,
    .doctor-action {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.86;
    }

    /* ── Loading / error ── */
    .state-msg {
      font-size: clamp(17px, 5vw, 22px);
      opacity: 0.8;
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    /* ── Demo mode bar ── */
    .demo-bar {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .demo-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .demo-btn.active {
      background: rgba(255, 255, 255, 0.32);
      color: #fff;
      font-weight: 700;
      border-color: rgba(255, 255, 255, 0.65);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <main id="card" class="card" aria-live="polite">
      <h1 class="plant-title">🌿 バジルの状態</h1>
      <div class="state-msg">
        <span class="spinner"></span>読み込み中…
      </div>
    </main>

    <aside id="doctor-card" class="doctor-card" aria-live="polite">
      <div class="doctor-title">Plant Doctor</div>
      <div class="state-msg">診断待機中…</div>
    </aside>
  </div>

  <div id="demo-bar" class="demo-bar" role="group" aria-label="表示モード切替">
    <button type="button" data-mode="normal" class="demo-btn active" aria-pressed="true">通常</button>
    <button type="button" data-mode="good" class="demo-btn" aria-pressed="false">良好</button>
    <button type="button" data-mode="warning" class="demo-btn" aria-pressed="false">注意</button>
    <button type="button" data-mode="danger" class="demo-btn" aria-pressed="false">要対応</button>
  </div>

  <footer id="footer" class="footer"></footer>

  <script src="config.js"></script>
  <script>
    const BASE = (window.PLANT_CONFIG?.SUPABASE_URL || "").replace(/\/$/, "");
    const KEY  = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    if (!BASE || !KEY) showState("設定が見つかりません");

    const THEMES = {
      good:    { bg1: "#0c4a24", bg2: "#166534", label: "良好"   },
      caution: { bg1: "#451a03", bg2: "#78350f", label: "注意"   },
      alert:   { bg1: "#450a0a", bg2: "#7f1d1d", label: "要対応" },
    };

    const DEMO_DATA = {
      good: {
        temperature: 26.0, humidity: 50.0,
        solution_temperature: 24.5,
        water_raw: 2100, water_status: "enough_water",
        water_voltage: 1.692,
        light_lux: 3500, light_status: "bright",
        vitality_score: 92, message: "安定しています",
      },
      warning: {
        temperature: 30.5, humidity: 38.0,
        solution_temperature: 28.0,
        water_raw: 900, water_status: "wet",
        water_voltage: 0.725,
        light_lux: 600, light_status: "dim",
        vitality_score: 68, message: "やや注意が必要です",
      },
      danger: {
        temperature: 36.0, humidity: 28.0,
        solution_temperature: 32.5,
        water_raw: 0, water_status: "dry",
        water_voltage: 0.0,
        light_lux: 40, light_status: "dark",
        vitality_score: 40, message: "乾燥しています",
      },
    };

    let demoMode = null;
    const DEVICE_ID = new URLSearchParams(window.location.search).get("device") || "raspi";

    function theme(score) {
      if (score >= 80) return THEMES.good;
      if (score >= 60) return THEMES.caution;
      return THEMES.alert;
    }

    function toJst(utcStr) {
      const s = /Z|[+-]\d{2}:?\d{2}$/.test(utcStr) ? utcStr : utcStr + "Z";
      return new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
    }

    function fmt(v, d = 1) {
      return v != null ? Number(v).toFixed(d) : "--";
    }

    function fmtRaw(v) {
      return v != null ? Number(v).toString() : "--";
    }

    function sensorStatusLabel(kind, value) {
      const labels = {
        water: {
          dry: "乾燥",
          transition: "境界",
          wet: "湿り",
          enough_water: "十分",
        },
        light: {
          dark: "暗い",
          dim: "やや暗い",
          bright: "明るい",
        },
      };
      return labels[kind]?.[value] || "不明";
    }

    function normalizeData(data) {
      return {
        ...data,
        water_raw: data.water_raw ?? data.water_level_raw,
        water_voltage: data.water_voltage ?? data.water_level_voltage,
        water_status:
          data.water_status ??
          (data.float_switch_triggered == null
            ? null
            : data.float_switch_triggered
              ? "dry"
              : "enough_water"),
        source: data.source ?? data.sensor_type,
      };
    }

    function vitalitySummary(score) {
      if (score >= 90) return ["good", "非常に良好です。植物は健康な状態です。"];
      if (score >= 70) return ["good", "安定しています。現在の管理を継続してください。"];
      if (score >= 50) return ["warning", "やや注意が必要です。温度・湿度・水位・照度を確認してください。"];
      if (score >= 30) return ["warning", "植物にストレスがかかっている可能性があります。"];
      return ["danger", "要対応です。給水・温度・光環境を確認してください。"];
    }

    function addCause(result, label, confidence, comment, actions) {
      result.possibleCauses.push({ label, confidence, comment });
      actions.forEach(function(action) {
        if (!result.actions.includes(action)) result.actions.push(action);
      });
    }

    function isCoreDaylight(data) {
      if (!data.created_at) return true;
      const observedAt = new Date(data.created_at);
      if (Number.isNaN(observedAt.getTime())) return true;
      const hour = observedAt.getHours();
      return hour >= 9 && hour < 15;
    }

    function generateAdvice(data) {
      const d = normalizeData(data);
      const score = d.vitality_score ?? 0;
      const summary = vitalitySummary(score);
      const result = {
        status: summary[0],
        summary: summary[1],
        possibleCauses: [],
        actions: [],
      };

      if (d.water_status === "dry" || d.float_switch_triggered === true) {
        addCause(
          result,
          "水位低下",
          95,
          "根への給水が途切れると、光や温度が良好でも短時間で吸水・蒸散のバランスが崩れます。",
          ["タンク水位を最優先で確認してください。", "根・フェルト・給水経路が水に接触しているか確認してください。"]
        );
      }
      if (d.solution_temperature >= 30) {
        addCause(
          result,
          "養液高温",
          85,
          "高い養液温度では根の呼吸需要が増える一方、溶存酸素は減りやすくなります。",
          ["養液を日陰に置き、30℃未満へ下げてください。", "根域の通気・循環を確認してください。"]
        );
      } else if (d.solution_temperature != null && d.solution_temperature < 15) {
        addCause(
          result,
          "養液低温",
          80,
          "低温の養液では根の吸水と養分吸収が鈍り、生育が停滞しやすくなります。",
          ["養液を15℃以上へ戻し、急激な温度変化を避けてください。"]
        );
      }
      if (
        (d.water_status === "dry" || d.float_switch_triggered === true) &&
        d.solution_temperature != null &&
        (d.solution_temperature >= 30 || d.solution_temperature < 15)
      ) {
        addCause(
          result,
          "水位・養液温度の複合ストレス",
          95,
          "水不足と根域温度異常が重なり、単独要因より強いストレスになる可能性があります。",
          ["先に給水を復旧し、その後に養液温度を適正域へ戻してください。"]
        );
      }
      if (d.water_status === "wet" && score < 50) {
        addCause(
          result,
          "給水経路異常",
          85,
          "貯水部には水がありますが、植物保持材や根まで水が届いていない可能性があります。フェルト・ろ過ウール・根の接触状態を確認してください。",
          [
            "フェルトが湿っているか確認してください。",
            "ろ過ウール全体に水が広がっているか確認してください。",
            "根がろ過ウールに接触しているか確認してください。",
            "必要に応じて、ろ過ウールを直接湿らせてください。",
          ]
        );
      }
      if (d.temperature >= 30 && d.light_status === "bright") {
        addCause(
          result,
          "高温・強光ストレス",
          70,
          "高温かつ強光のため、葉のしおれや蒸散増加が起きる可能性があります。",
          ["LEDとの距離を広げてください。", "一時的に明るい日陰へ移動してください。", "ファンや換気を検討してください。"]
        );
      }
      if (d.humidity < 40) {
        addCause(
          result,
          "乾燥ストレス",
          65,
          "湿度が低く、植物の蒸散が増えている可能性があります。",
          ["水位と保持材の湿りを確認してください。", "強光を一時的に避けてください。"]
        );
      }
      if (
        isCoreDaylight(d) &&
        (d.light_status === "dim" || d.light_status === "dark")
      ) {
        addCause(
          result,
          "光量不足",
          60,
          "日中コア時間帯の照度が低く、日積算光量が不足する可能性があります。",
          ["遮蔽物やセンサー位置を確認し、数日間の日中推移を比較してください。"]
        );
      }
      if (
        score >= 70 &&
        (d.water_status === "wet" || d.water_status === "enough_water") &&
        (!isCoreDaylight(d) || d.light_status === "bright") &&
        (d.solution_temperature == null ||
          (d.solution_temperature >= 18 && d.solution_temperature <= 28))
      ) {
        addCause(
          result,
          "安定状態",
          90,
          "大きな異常は検出されていません。",
          ["現在の管理を継続してください。"]
        );
      }

      if (!result.actions.length) {
        result.actions.push("センサー値の推移を確認してください。");
      }
      result.possibleCauses = result.possibleCauses.slice(0, 3);
      result.actions = result.actions.slice(0, 3);
      return result;
    }

    function setBackground(t) {
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
    }

    /* showState: msg is always a hardcoded constant, but use textContent
       to ensure future callers (e.g. error.message) cannot inject HTML. */
    function showState(msg) {
      const card = document.getElementById("card");
      const doctor = document.getElementById("doctor-card");
      card.innerHTML =
        `<h1 class="plant-title">🌿 バジルの状態</h1>
         <div class="state-msg"></div>`;
      card.querySelector(".state-msg").textContent = msg;
      doctor.innerHTML =
        `<div class="doctor-title">Plant Doctor</div>
         <div class="state-msg"></div>`;
      doctor.querySelector(".state-msg").textContent = msg;
      document.getElementById("footer").innerHTML = "";
    }

    function appendDoctorRow(list, headText, valueText, commentText, level) {
      const row = document.createElement("li");
      row.className = "doctor-row";
      const head = document.createElement("div");
      head.className = "doctor-row-head";
      const left = document.createElement("span");
      const dot = document.createElement("span");
      dot.className = `level-dot ${level || ""}`;
      left.append(dot, " ", headText);
      const value = document.createElement("span");
      value.className = "doctor-value";
      value.textContent = valueText;
      head.append(left, value);
      const comment = document.createElement("div");
      comment.className = "doctor-comment";
      comment.textContent = commentText;
      row.append(head, comment);
      list.appendChild(row);
    }

    function appendSimpleRow(list, text, className = "doctor-action") {
      const row = document.createElement("li");
      row.className = "doctor-row";
      const body = document.createElement("div");
      body.className = className;
      body.textContent = text;
      row.appendChild(body);
      list.appendChild(row);
    }

    function renderDoctor(d, advice) {
      const doctor = document.getElementById("doctor-card");
      doctor.innerHTML = `
        <div class="doctor-title">Plant Doctor</div>
        <section class="doctor-section">
          <div class="doctor-heading">推定原因</div>
          <ul class="doctor-list" id="possible-causes"></ul>
        </section>
        <section class="doctor-section">
          <div class="doctor-heading">推奨アクション</div>
          <ul class="doctor-list" id="doctor-actions"></ul>
        </section>
      `;

      const causes = document.getElementById("possible-causes");
      advice.possibleCauses.forEach(function(item) {
        appendDoctorRow(causes, item.label, `${item.confidence}%`, item.comment, advice.status);
      });
      if (!advice.possibleCauses.length) {
        appendSimpleRow(causes, "明確な原因候補はありません。継続して推移を確認してください。", "doctor-comment");
      }

      const actions = document.getElementById("doctor-actions");
      advice.actions.forEach(function(action) {
        appendSimpleRow(actions, action);
      });
    }

    function render(d) {
      d = normalizeData(d);
      const score = d.vitality_score ?? 0;
      const t     = theme(score);
      const advice = generateAdvice(d);
      setBackground(t);

      /* Build static skeleton via innerHTML (no user data here),
         then populate dynamic values via textContent to prevent XSS. */
      const card = document.getElementById("card");
      card.innerHTML = `
        <h1 class="plant-title">🌿 バジルの状態</h1>
        <div class="score-section">
          <div class="score-number" id="score-num"></div>
          <div class="status-chip">
            <span class="status-dot"></span><span id="status-label"></span>
          </div>
        </div>
        <div class="sensors">
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="temp-val"></span><span class="sensor-unit">℃</span>
            </div>
            <div class="sensor-label">温度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="hum-val"></span><span class="sensor-unit">%</span>
            </div>
            <div class="sensor-label">湿度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="solution-temp-val"></span><span class="sensor-unit">℃</span>
            </div>
            <div class="sensor-label">養液温度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value" id="water-status"></div>
            <div class="sensor-label">水位</div>
            <div class="sensor-detail">raw: <span id="water-raw"></span></div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value" id="light-status"></div>
            <div class="sensor-label">照度</div>
            <div class="sensor-detail" id="light-detail"></div>
          </div>
        </div>
        <div class="message" id="msg-box"></div>
      `;

      document.getElementById("score-num").textContent    = score;
      document.getElementById("status-label").textContent = t.label;
      document.getElementById("temp-val").textContent     = fmt(d.temperature);
      document.getElementById("hum-val").textContent      = fmt(d.humidity);
      document.getElementById("solution-temp-val").textContent = fmt(d.solution_temperature);
      document.getElementById("msg-box").textContent      = advice.summary;
      document.getElementById("water-status").textContent = sensorStatusLabel("water", d.water_status);
      document.getElementById("water-raw").textContent    = fmtRaw(d.water_raw);
      document.getElementById("light-status").textContent = sensorStatusLabel("light", d.light_status);
      document.getElementById("light-detail").textContent =
        d.light_lux != null ? `${fmt(d.light_lux)} lx` : `raw: ${fmtRaw(d.light_raw)}`;
      renderDoctor(d, advice);

      const footer = document.getElementById("footer");
      const strong = document.createElement("strong");
      strong.textContent = toJst(d.created_at);
      footer.innerHTML = "";
      footer.append("最終更新：", strong);
    }

    function renderDemo(mode) {
      render({ ...DEMO_DATA[mode], created_at: new Date().toISOString() });
      const footer = document.getElementById("footer");
      footer.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = "デモモード";
      footer.appendChild(strong);
    }

    function setActiveBtn(mode) {
      document.querySelectorAll(".demo-btn").forEach(function(btn) {
        const isActive = btn.dataset.mode === (mode || "normal");
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
    }

    let liveInterval = null;

    function applyDemoMode(mode) {
      demoMode = mode;
      setActiveBtn(mode);
      if (demoMode) {
        clearInterval(liveInterval);
        liveInterval = null;
        renderDemo(demoMode);
      } else {
        loadData();
        liveInterval = setInterval(loadData, 10_000);
      }
    }

    document.querySelectorAll(".demo-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        applyDemoMode(btn.dataset.mode === "normal" ? null : btn.dataset.mode);
      });
    });

    async function loadData() {
      if (demoMode) return;
      if (!BASE || !KEY) return;
      try {
        const res = await fetch(
          `${BASE}/rest/v1/sensor_logs` +
          `?select=temperature,humidity,solution_temperature,water_raw,water_voltage,water_status,light_raw,light_voltage,light_lux,light_status,float_switch_triggered,float_switch_state,device_id,location_id,vitality_score,message,created_at` +
          `&device_id=eq.${encodeURIComponent(DEVICE_ID)}` +
          `&order=created_at.desc&limit=1`,
          { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { showState("データがありません"); return; }
        render(rows[0]);
      } catch (e) {
        showState("データ取得失敗");
        console.error(e);
      }
    }

    const demoParam = new URLSearchParams(window.location.search).get("demo");
    if (demoParam && Object.hasOwn(DEMO_DATA, demoParam)) {
      applyDemoMode(demoParam);
    } else {
      loadData();
      liveInterval = setInterval(loadData, 10_000);
    }
  </script>
</body>
</html>
