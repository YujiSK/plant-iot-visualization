<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0c4a24;
      --bg2: #166534;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      transition: background 0.7s ease;
      -webkit-font-smoothing: antialiased;
    }

    .page-header {
      width: min(1120px, 100%);
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      margin-bottom: 18px;
    }

    .page-title {
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: clamp(13px, 3vw, 15px);
      line-height: 1.7;
      opacity: 0.82;
    }

    .workspace {
      width: min(1400px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 0.9fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .panel {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .panel-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 18px;
      color: #fff;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .panel-lead {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.78;
      margin-bottom: 12px;
    }

    /* ── Glass card ── */
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }

    .device-card {
      padding: 26px 20px 22px;
      text-align: left;
    }

    .device-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .device-title-wrap {
      min-width: 0;
    }

    .device-title {
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .device-subtitle {
      font-size: 13px;
      opacity: 0.72;
      line-height: 1.6;
    }

    .device-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .device-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
    }

    .device-card {
      padding: 26px 22px 22px;
      text-align: left;
    }

    .plant-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Score ── */
    .score-section {
      margin-bottom: 28px;
    }

    .score-number {
      font-size: clamp(80px, 22vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      padding: 6px 16px 6px 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* ── Sensor tiles ── */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sensor-tile {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 12px 14px;
    }

    .sensor-value {
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sensor-unit {
      font-size: clamp(16px, 4.5vw, 21px);
      font-weight: 500;
      opacity: 0.8;
      margin-left: 1px;
    }

    .sensor-label {
      margin-top: 5px;
      font-size: clamp(11px, 3vw, 13px);
      opacity: 0.65;
      letter-spacing: 0.07em;
    }

    .sensor-detail {
      margin-top: 4px;
      font-size: clamp(10px, 2.8vw, 12px);
      opacity: 0.55;
    }

    .status-value {
      font-size: clamp(24px, 7vw, 32px);
      letter-spacing: 0;
    }

    /* ── Message ── */
    .message {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      line-height: 1.55;
      opacity: 0.92;
    }

    /* ── Analysis ── */
    .analysis-title {
      font-size: clamp(17px, 4vw, 20px);
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .analysis-section {
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    .analysis-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .analysis-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      opacity: 0.74;
    }

    .level-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      flex: 0 0 auto;
    }

    .level-dot.good { background: #86efac; }
    .level-dot.warning { background: #facc15; }
    .level-dot.danger { background: #f87171; }

    .analysis-list {
      display: grid;
      gap: 7px;
      list-style: none;
    }

    .analysis-row {
      display: grid;
      gap: 4px;
      padding: 9px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      line-height: 1.45;
    }

    .analysis-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 750;
    }

    .analysis-value {
      opacity: 0.72;
      font-weight: 650;
      white-space: nowrap;
    }

    .analysis-comment,
    .analysis-action {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.86;
    }

    /* ── Loading / error ── */
    .state-msg {
      font-size: clamp(17px, 5vw, 22px);
      opacity: 0.8;
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    .global-footer {
      width: min(1400px, 100%);
      margin-top: 18px;
    }

    .period-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin: 0 0 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .period-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .period-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .period-btn.active {
      background: rgba(255, 255, 255, 0.32);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.68);
    }

    .card-header-note {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.7;
      line-height: 1.55;
    }

    .chart-panel {
      margin: 18px 0 16px;
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
    }

    .chart-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .chart-title {
      font-weight: 700;
      opacity: 0.9;
    }

    .chart-meta {
      opacity: 0.68;
      text-align: right;
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .summary-tile {
      background: rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 12px 12px 10px;
    }

    .summary-label {
      font-size: 11px;
      opacity: 0.68;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }

    .summary-unit {
      font-size: 14px;
      opacity: 0.7;
      margin-left: 2px;
      font-weight: 600;
    }

    .summary-note {
      margin-top: 5px;
      font-size: 12px;
      opacity: 0.62;
      line-height: 1.45;
    }

    .analysis-list.compact .analysis-row {
      padding: 8px 10px;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="page-title">Plant IoT 2台ダッシュボード</div>
    <div class="page-subtitle">1号機は動作確認、2号機は実栽培環境として分けて表示します。最新値と判定を並べて確認できます。</div>
  </header>

  <div class="workspace">
    <section class="panel">
      <div class="panel-shell">
        <div class="panel-title">最新センサー</div>
        <div class="panel-lead">1号機は動作確認、2号機は実栽培環境です。左側で最新値とアドバイスを確認します。</div>
        <div id="device-stack" class="panel"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-shell">
        <div class="panel-title">データ推移</div>
        <div class="panel-lead">期間を切り替えて、各機体の vitality 推移を追えます。</div>
        <div id="period-bar" class="period-bar" role="group" aria-label="表示期間切替">
          <button type="button" data-period="6h" class="period-btn">6時間</button>
          <button type="button" data-period="24h" class="period-btn active">24時間</button>
          <button type="button" data-period="7d" class="period-btn">7日</button>
        </div>
        <div id="graph-stack" class="panel"></div>
      </div>
    </aside>

    <aside class="panel">
      <div class="panel-shell">
        <div class="panel-title">目的・背景・進捗</div>
        <div id="project-summary" class="panel-lead"></div>
      </div>
    </aside>
  </div>

  <footer id="footer" class="footer global-footer"></footer>

  <script src="config.js"></script>
  <script>
    const BASE = (window.PLANT_CONFIG?.SUPABASE_URL || "").replace(/\/$/, "");
    const KEY = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    const DEVICES = [
      { id: "raspi", label: "1号機", title: "raspi", note: "動作確認ノード", accent: "#7dd3fc" },
      { id: "raspberrypi2", label: "2号機", title: "raspberrypi2", note: "実栽培環境", accent: "#fde68a" },
    ];

    const PERIODS = {
      "6h": { label: "6時間", hours: 6 },
      "24h": { label: "24時間", hours: 24 },
      "7d": { label: "7日", hours: 24 * 7 },
    };

    const THEMES = {
      good:    { bg1: "#0c4a24", bg2: "#166534", label: "良好" },
      caution: { bg1: "#451a03", bg2: "#78350f", label: "注意" },
      alert:   { bg1: "#450a0a", bg2: "#7f1d1d", label: "要対応" },
    };

    const QUERY_FIELDS =
      "temperature,humidity,solution_temperature,water_raw,water_voltage,water_status,light_raw,light_voltage,light_lux,light_status,float_switch_triggered,float_switch_state,device_id,location_id,vitality_score,message,created_at";

    let selectedPeriod = "24h";
    let refreshTimer = null;

    function theme(score) {
      if (score >= 80) return THEMES.good;
      if (score >= 60) return THEMES.caution;
      return THEMES.alert;
    }

    function toJst(utcStr) {
      const s = /Z|[+-]\d{2}:?\d{2}$/.test(utcStr) ? utcStr : `${utcStr}Z`;
      return new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
    }

    function fmt(v, d = 1) {
      return v != null ? Number(v).toFixed(d) : "--";
    }

    function fmtRaw(v) {
      return v != null ? Number(v).toString() : "--";
    }

    function normalize(data) {
      return {
        ...data,
        water_raw: data.water_raw ?? data.water_level_raw,
        water_status:
          data.water_status ??
          (data.float_switch_triggered == null ? null : (data.float_switch_triggered ? "dry" : "enough_water")),
      };
    }

    function waterLabel(value) {
      return { dry: "乾燥", transition: "境界", wet: "湿り", enough_water: "十分" }[value] || "不明";
    }

    function lightLabel(value) {
      return { dark: "暗い", dim: "やや暗い", bright: "明るい" }[value] || "不明";
    }

    function vitalitySummary(score) {
      if (score >= 90) return ["良好", "非常に良好です。"];
      if (score >= 70) return ["良好", "安定しています。"];
      if (score >= 50) return ["注意", "少し注意が必要です。"];
      if (score >= 30) return ["注意", "ストレスが増えています。"];
      return ["要対応", "給水や環境を確認してください。"];
    }

    function adviceFor(data) {
      const d = normalize(data);
      const score = d.vitality_score ?? 0;
      const [label, summary] = vitalitySummary(score);
      const causes = [];
      const actions = [];

      if (d.water_status === "dry" || d.float_switch_triggered === true) {
        causes.push("水位が低い可能性");
        actions.push("まず水位を確認してください。");
      }
      if (d.solution_temperature != null && d.solution_temperature >= 30) {
        causes.push("養液がやや高温");
        actions.push("養液を少し涼しい場所へ移してください。");
      }
      if (d.humidity != null && d.humidity < 40) {
        causes.push("空気が乾き気味");
        actions.push("乾燥が続くか見てください。");
      }
      if (d.light_status === "dark" || d.light_status === "dim") {
        causes.push("日中の光が少なめ");
        actions.push("光の当たり方を確認してください。");
      }
      if (!causes.length && score >= 70) {
        causes.push("大きな異常は見えていません");
        actions.push("今の管理を続けてください。");
      }

      return { label, summary, causes: causes.slice(0, 3), actions: actions.slice(0, 3) };
    }

    function setBackground(score) {
      const t = theme(score);
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
    }

    function periodHours() {
      return PERIODS[selectedPeriod]?.hours || 24;
    }

    function setPeriodButtons() {
      document.querySelectorAll(".period-btn").forEach(function(btn) {
        const active = btn.dataset.period === selectedPeriod;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });
    }

    function renderProjectSummary() {
      document.getElementById("project-summary").innerHTML = `
        <p>このプロジェクトは、バジルの状態をセンサーと記録で見やすくするためのものです。</p>
        <p style="margin-top:10px;">今は、1号機で動作確認、2号機で実栽培を進めています。</p>
        <ul style="margin: 12px 0 0 18px; line-height: 1.7;">
          <li>何が起きたかをすぐ気づけるようにする</li>
          <li>写真とセンサーをあわせて確認する</li>
          <li>作業内容をあとから振り返れるようにする</li>
          <li>必要な通知や記録を少しずつ自動化する</li>
        </ul>
      `;
    }

    function renderDeviceCard(device, data) {
      const card = document.getElementById(`card-${device.id}`);
      if (!data) {
        card.innerHTML = `<div class="state-msg"><span class="spinner"></span>${device.label}を読み込み中…</div>`;
        return;
      }
      const d = normalize(data);
      const score = d.vitality_score ?? 0;
      const advice = adviceFor(d);
      const [stateLabel] = vitalitySummary(score);
      const lastUpdated = d.created_at ? toJst(d.created_at) : "--";

      card.innerHTML = `
        <div class="device-head">
          <div class="device-title-wrap">
            <div class="device-title">${device.label} ${device.title}</div>
            <div class="device-subtitle">${device.note}</div>
            <div class="card-header-note">最終更新 ${lastUpdated}</div>
          </div>
          <div class="device-badge"><span class="device-badge-dot"></span><span>${stateLabel}</span></div>
        </div>
        <div class="score-section">
          <div class="score-number">${score}</div>
          <div class="status-chip"><span class="status-dot"></span><span>${advice.summary}</span></div>
        </div>
        <div class="sensors">
          <div class="sensor-tile">
            <div class="sensor-value"><span>${fmt(d.temperature)}</span><span class="sensor-unit">℃</span></div>
            <div class="sensor-label">温度</div>
            <div class="sensor-detail">湿度 ${fmt(d.humidity)}%</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value"><span>${fmt(d.solution_temperature)}</span><span class="sensor-unit">℃</span></div>
            <div class="sensor-label">養液温度</div>
            <div class="sensor-detail">${d.solution_temperature != null ? (d.solution_temperature >= 30 ? "高め" : d.solution_temperature < 15 ? "低め" : "適正") : "--"}</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value">${waterLabel(d.water_status)}</div>
            <div class="sensor-label">水位</div>
            <div class="sensor-detail">raw ${fmtRaw(d.water_raw)}</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value">${lightLabel(d.light_status)}</div>
            <div class="sensor-label">照度</div>
            <div class="sensor-detail">${d.light_lux != null ? `${fmt(d.light_lux)} lx` : `raw ${fmtRaw(d.light_raw)}`}</div>
          </div>
        </div>
        <div class="message">${advice.summary}</div>
        <section class="analysis-section">
          <div class="analysis-heading">気になる点</div>
          <ul class="analysis-list compact">
            ${advice.causes.map((item) => `<li class="analysis-row"><div class="analysis-comment">${item}</div></li>`).join("") || '<li class="analysis-row"><div class="analysis-comment">特に大きな異常は見えていません。</div></li>'}
          </ul>
        </section>
        <section class="analysis-section">
          <div class="analysis-heading">次の一手</div>
          <ul class="analysis-list compact">
            ${advice.actions.map((item) => `<li class="analysis-row"><div class="analysis-action">${item}</div></li>`).join("") || '<li class="analysis-row"><div class="analysis-action">様子を見ながら記録を続けてください。</div></li>'}
          </ul>
        </section>
      `;
    }

    function aggregateSeries(rows, maxPoints) {
      const points = rows
        .map((row) => {
          const d = normalize(row);
          const x = new Date(d.created_at).getTime();
          const y = Number(d.vitality_score ?? 0);
          return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;
        })
        .filter(Boolean);
      if (points.length <= maxPoints) return points;
      const bucketSize = Math.ceil(points.length / maxPoints);
      const compressed = [];
      for (let i = 0; i < points.length; i += bucketSize) {
        const bucket = points.slice(i, i + bucketSize);
        const avgY = bucket.reduce((sum, p) => sum + p.y, 0) / bucket.length;
        compressed.push({ x: bucket[0].x, y: avgY });
      }
      return compressed;
    }

    function buildChart(points, accent) {
      if (!points.length) {
        return '<div class="state-msg" style="padding:16px 0 10px;">この期間のデータがありません</div>';
      }

      const width = 640;
      const height = 190;
      const pad = { left: 42, right: 14, top: 14, bottom: 28 };
      const minX = points[0].x;
      const maxX = points[points.length - 1].x || (minX + 1);
      const spanX = Math.max(1, maxX - minX);
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;

      function xScale(x) {
        return pad.left + ((x - minX) / spanX) * innerW;
      }

      function yScale(y) {
        return pad.top + (1 - y / 100) * innerH;
      }

      const line = points.map((p) => `${xScale(p.x).toFixed(1)},${yScale(p.y).toFixed(1)}`).join(" ");
      const area = [
        `M ${xScale(points[0].x).toFixed(1)} ${yScale(points[0].y).toFixed(1)}`,
        ...points.slice(1).map((p) => `L ${xScale(p.x).toFixed(1)} ${yScale(p.y).toFixed(1)}`),
        `L ${xScale(points[points.length - 1].x).toFixed(1)} ${height - pad.bottom}`,
        `L ${xScale(points[0].x).toFixed(1)} ${height - pad.bottom}`,
        "Z",
      ].join(" ");

      const grid = [25, 50, 75, 100].map((value) => {
        const y = yScale(value).toFixed(1);
        return `
          <line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
          <text x="12" y="${(Number(y) + 4).toFixed(1)}" fill="rgba(255,255,255,0.65)" font-size="11">${value}</text>
        `;
      }).join("");

      const start = new Date(points[0].x).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false });
      const end = new Date(points[points.length - 1].x).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false });

      return `
        <svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="健康スコアの推移">
          <rect x="0" y="0" width="${width}" height="${height}" rx="16" fill="rgba(255,255,255,0.04)"></rect>
          ${grid}
          <path d="${area}" fill="${accent}22"></path>
          <polyline points="${line}" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
          <circle cx="${xScale(points[points.length - 1].x).toFixed(1)}" cy="${yScale(points[points.length - 1].y).toFixed(1)}" r="4.5" fill="${accent}" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"></circle>
          <text x="${pad.left}" y="${height - 8}" fill="rgba(255,255,255,0.72)" font-size="11">${start}</text>
          <text x="${width - pad.right}" y="${height - 8}" fill="rgba(255,255,255,0.72)" font-size="11" text-anchor="end">${end}</text>
        </svg>
      `;
    }

    function renderGraphCard(device, rows) {
      const box = document.getElementById(`graph-${device.id}`);
      if (!rows.length) {
        box.innerHTML = `<div class="state-msg"><span class="spinner"></span>${device.label}のグラフを読み込み中…</div>`;
        return;
      }

      const latest = normalize(rows[rows.length - 1]);
      const points = aggregateSeries(rows, 120);
      const values = rows.map((row) => Number(normalize(row).vitality_score ?? 0)).filter(Number.isFinite);
      const min = values.length ? Math.min(...values) : null;
      const avg = values.length ? (values.reduce((sum, v) => sum + v, 0) / values.length) : null;
      const max = values.length ? Math.max(...values) : null;

      box.innerHTML = `
        <div class="panel-shell" style="padding: 16px 16px 14px; margin-bottom: 14px;">
          <div class="panel-title" style="margin-bottom: 6px;">${device.label} ${device.title}</div>
          <div class="panel-lead" style="margin-bottom: 10px;">${PERIODS[selectedPeriod].label} の変化をまとめたグラフです。</div>
          <div class="chart-title-row">
            <div class="chart-title">健康スコア</div>
            <div class="chart-meta">最小 ${min != null ? min : "--"} / 平均 ${avg != null ? avg.toFixed(1) : "--"} / 最大 ${max != null ? max : "--"}</div>
          </div>
          ${buildChart(points, device.accent)}
          <div class="summary-grid" style="margin-top: 10px;">
            <div class="summary-tile"><div class="summary-label">今の点数</div><div class="summary-value">${latest.vitality_score ?? "--"}</div></div>
            <div class="summary-tile"><div class="summary-label">水位</div><div class="summary-value">${waterLabel(latest.water_status)}</div></div>
            <div class="summary-tile"><div class="summary-label">照度</div><div class="summary-value">${lightLabel(latest.light_status)}</div></div>
            <div class="summary-tile"><div class="summary-label">養液温度</div><div class="summary-value">${fmt(latest.solution_temperature)}<span class="summary-unit">℃</span></div></div>
          </div>
        </div>
      `;
    }

    function updateProjectSummary() {
      document.getElementById("project-summary").innerHTML = `
        <p>このプロジェクトは、バジルの状態をセンサー、写真、記録で見やすくするためのものです。</p>
        <p style="margin-top:10px;">1号機と2号機を分けて運用し、実際の栽培に役立つ見方を作っています。</p>
        <ul style="margin: 12px 0 0 18px; line-height: 1.75;">
          <li>異変に早く気づけるようにする</li>
          <li>写真とセンサーをあわせて確認する</li>
          <li>作業内容をあとから振り返れるようにする</li>
          <li>必要な通知や記録を少しずつ自動化する</li>
        </ul>
        <div style="margin-top:14px; font-size:13px; line-height:1.7; opacity:0.8;">
          現在は、実栽培の観察を続けながら、画面と記録の使いやすさを整えています。
        </div>
      `;
    }

    async function fetchRows(device) {
      const hours = periodHours();
      const since = new Date(Date.now() - hours * 3600_000).toISOString();
      const res = await fetch(
        `${BASE}/rest/v1/sensor_logs` +
        `?select=${encodeURIComponent(QUERY_FIELDS)}` +
        `&device_id=eq.${encodeURIComponent(device.id)}` +
        `&created_at=gte.${encodeURIComponent(since)}` +
        `&order=created_at.asc&limit=2500`,
        { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    function renderFooter(rowsByDevice) {
      const latest = Object.values(rowsByDevice)
        .flat()
        .map((row) => row.created_at)
        .filter(Boolean)
        .sort()
        .pop();
      const footer = document.getElementById("footer");
      footer.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = latest
        ? `${toJst(latest)} / ${PERIODS[selectedPeriod].label}`
        : PERIODS[selectedPeriod].label;
      footer.append("最終更新：", strong);
    }

    async function loadAll() {
      if (!BASE || !KEY) {
        document.getElementById("device-stack").innerHTML = '<div class="state-msg">設定が見つかりません</div>';
        document.getElementById("graph-stack").innerHTML = '<div class="state-msg">設定が見つかりません</div>';
        return;
      }

      setPeriodButtons();
      const results = {};
      const states = {};

      await Promise.all(DEVICES.map(async (device) => {
        try {
          const rows = await fetchRows(device);
          results[device.id] = rows;
          states[device.id] = rows.length ? normalize(rows[rows.length - 1]) : null;
        } catch (err) {
          console.error(device.id, err);
          results[device.id] = [];
          states[device.id] = null;
        }
      }));

      const latestScores = Object.values(states).map((row) => row?.vitality_score).filter((v) => v != null);
      setBackground(latestScores.length ? Math.min(...latestScores) : 80);

      const deviceStack = document.getElementById("device-stack");
      deviceStack.innerHTML = "";
      DEVICES.forEach((device) => {
        const block = document.createElement("div");
        block.className = "panel";
        block.innerHTML = `<main id="card-${device.id}" class="card device-card"></main>`;
        deviceStack.appendChild(block);
        renderDeviceCard(device, states[device.id]);
      });

      const graphStack = document.getElementById("graph-stack");
      graphStack.innerHTML = "";
      DEVICES.forEach((device) => {
        const block = document.createElement("div");
        block.innerHTML = `<div id="graph-${device.id}"></div>`;
        graphStack.appendChild(block);
        renderGraphCard(device, results[device.id] || []);
      });

      renderProjectSummary();
      renderFooter(results);
    }

    document.querySelectorAll(".period-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedPeriod = btn.dataset.period;
        loadAll();
      });
    });

    loadAll();
    refreshTimer = setInterval(loadAll, 30_000);
  </script>
</body>
</html>
