<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0c4a24;
      --bg2: #166534;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      transition: background 0.7s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Glass card ── */
    .card {
      width: min(400px, 100%);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 32px 24px 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .plant-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Score ── */
    .score-section {
      margin-bottom: 28px;
    }

    .score-number {
      font-size: clamp(80px, 22vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      padding: 6px 16px 6px 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* ── Sensor tiles ── */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sensor-tile {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 12px 14px;
    }

    .sensor-value {
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sensor-unit {
      font-size: clamp(16px, 4.5vw, 21px);
      font-weight: 500;
      opacity: 0.8;
      margin-left: 1px;
    }

    .sensor-label {
      margin-top: 5px;
      font-size: clamp(11px, 3vw, 13px);
      opacity: 0.65;
      letter-spacing: 0.07em;
    }

    .sensor-detail {
      margin-top: 4px;
      font-size: clamp(10px, 2.8vw, 12px);
      opacity: 0.55;
    }

    .status-value {
      font-size: clamp(24px, 7vw, 32px);
      letter-spacing: 0;
    }

    /* ── Message ── */
    .message {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      line-height: 1.55;
      opacity: 0.92;
    }

    .advice-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      text-align: left;
    }

    .advice-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: clamp(12px, 3.5vw, 14px);
      line-height: 1.5;
    }

    .advice-label {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.62;
    }

    /* ── Loading / error ── */
    .state-msg {
      font-size: clamp(17px, 5vw, 22px);
      opacity: 0.8;
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    /* ── Demo mode bar ── */
    .demo-bar {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .demo-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .demo-btn.active {
      background: rgba(255, 255, 255, 0.32);
      color: #fff;
      font-weight: 700;
      border-color: rgba(255, 255, 255, 0.65);
    }
  </style>
</head>
<body>

  <main id="card" class="card" aria-live="polite">
    <h1 class="plant-title">🌿 バジルの状態</h1>
    <div class="state-msg">
      <span class="spinner"></span>読み込み中…
    </div>
  </main>

  <div id="demo-bar" class="demo-bar" role="group" aria-label="表示モード切替">
    <button type="button" data-mode="normal" class="demo-btn active" aria-pressed="true">通常</button>
    <button type="button" data-mode="good" class="demo-btn" aria-pressed="false">良好</button>
    <button type="button" data-mode="warning" class="demo-btn" aria-pressed="false">注意</button>
    <button type="button" data-mode="danger" class="demo-btn" aria-pressed="false">要対応</button>
  </div>

  <footer id="footer" class="footer"></footer>

  <script src="config.js"></script>
  <script>
    const BASE = (window.PLANT_CONFIG?.SUPABASE_URL || "").replace(/\/$/, "");
    const KEY  = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    if (!BASE || !KEY) showState("設定が見つかりません");

    const THEMES = {
      good:    { bg1: "#0c4a24", bg2: "#166534", label: "良好"   },
      caution: { bg1: "#451a03", bg2: "#78350f", label: "注意"   },
      alert:   { bg1: "#450a0a", bg2: "#7f1d1d", label: "要対応" },
    };

    const DEMO_DATA = {
      good: {
        temperature: 26.0, humidity: 50.0,
        water_raw: 2100, water_status: "enough_water",
        water_voltage: 1.692,
        light_raw: 1600, light_status: "bright",
        light_voltage: 1.289,
        vitality_score: 92, message: "安定しています",
      },
      warning: {
        temperature: 30.5, humidity: 38.0,
        water_raw: 900, water_status: "wet",
        water_voltage: 0.725,
        light_raw: 850, light_status: "dim",
        light_voltage: 0.685,
        vitality_score: 68, message: "やや注意が必要です",
      },
      danger: {
        temperature: 36.0, humidity: 28.0,
        water_raw: 0, water_status: "dry",
        water_voltage: 0.0,
        light_raw: 300, light_status: "dark",
        light_voltage: 0.242,
        vitality_score: 40, message: "乾燥しています",
      },
    };

    let demoMode = null;

    function theme(score) {
      if (score >= 80) return THEMES.good;
      if (score >= 60) return THEMES.caution;
      return THEMES.alert;
    }

    function toJst(utcStr) {
      const s = /Z|[+-]\d{2}:?\d{2}$/.test(utcStr) ? utcStr : utcStr + "Z";
      return new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
    }

    function fmt(v, d = 1) {
      return v != null ? Number(v).toFixed(d) : "--";
    }

    function fmtRaw(v) {
      return v != null ? Number(v).toString() : "--";
    }

    function sensorStatusLabel(kind, value) {
      const labels = {
        water: {
          dry: "乾燥",
          transition: "境界",
          wet: "湿り",
          enough_water: "十分",
        },
        light: {
          dark: "暗い",
          dim: "やや暗い",
          bright: "明るい",
        },
      };
      return labels[kind]?.[value] || "不明";
    }

    function adviceForTemperature(value) {
      if (value == null) return null;
      if (value >= 30) return ["温度", "高温です。直射日光やLEDの照射距離を確認してください。"];
      if (value >= 25) return ["温度", "適温範囲です。現在の環境は安定しています。"];
      if (value >= 15) return ["温度", "やや低温ですが問題ありません。生育速度が少し低下する場合があります。"];
      return ["温度", "低温です。植物によっては成長が鈍化する可能性があります。"];
    }

    function adviceForHumidity(value) {
      if (value == null) return null;
      if (value >= 80) return ["湿度", "湿度が高めです。カビや病害発生に注意してください。"];
      if (value >= 50) return ["湿度", "適正範囲です。植物にとって比較的良好な環境です。"];
      if (value >= 40) return ["湿度", "やや乾燥しています。植物の状態を確認してください。"];
      return ["湿度", "乾燥しています。葉のしおれや蒸散増加に注意してください。"];
    }

    function adviceForWater(d) {
      if (d.water_status === "dry") return ["水位", "水不足が検出されています。補水してください。"];
      if (d.water_raw == null) return null;
      if (d.water_raw >= 2500) return ["水位", "水位は十分あります。"];
      if (d.water_raw >= 1500) return ["水位", "水位は正常です。"];
      if (d.water_raw >= 1000) return ["水位", "水位が低下しています。補水を検討してください。"];
      return ["水位", "水不足の可能性があります。早めの補水を推奨します。"];
    }

    function adviceForLight(d) {
      if (d.light_status === "dim") return ["照度", "光量不足の可能性があります。照明や設置場所を確認してください。"];
      if (d.light_raw == null) return null;
      if (d.light_raw >= 3000) return ["照度", "十分な光量です。"];
      if (d.light_raw >= 2000) return ["照度", "おおむね良好です。"];
      if (d.light_raw >= 1000) return ["照度", "光量が不足気味です。設置場所や照明を確認してください。"];
      return ["照度", "光量不足です。生育に影響する可能性があります。"];
    }

    function totalAdvice(score) {
      if (score >= 90) return "非常に良好です。植物は健康な状態です。";
      if (score >= 70) return "安定しています。現在の環境を維持してください。";
      if (score >= 50) return "注意が必要です。一部の環境条件を確認してください。";
      if (score >= 30) return "植物にストレスが発生している可能性があります。";
      return "要対応です。給水や設置環境を確認してください。";
    }

    function inferredAdvice(d) {
      const score = d.vitality_score ?? 0;
      if ((d.water_status === "wet" || d.water_status === "enough_water") && score < 50) {
        return ["原因推定", "貯水部には水がありますが、植物保持材や根まで水が届いていない可能性があります。"];
      }
      if (d.temperature >= 30 && d.light_status === "bright") {
        return ["原因推定", "高温・強光ストレスの可能性があります。LED距離や設置場所を確認してください。"];
      }
      if ((d.water_status === "wet" || d.water_status === "enough_water") && score >= 70) {
        return ["原因推定", "貯水部・環境値は安定しています。大きな異常は検出されていません。"];
      }
      return null;
    }

    function generateAdvice(d) {
      const items = [
        inferredAdvice(d),
        adviceForTemperature(d.temperature),
        adviceForHumidity(d.humidity),
        adviceForWater(d),
        adviceForLight(d),
      ].filter(Boolean);
      return items.slice(0, 3);
    }

    function setBackground(t) {
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
    }

    /* showState: msg is always a hardcoded constant, but use textContent
       to ensure future callers (e.g. error.message) cannot inject HTML. */
    function showState(msg) {
      const card = document.getElementById("card");
      card.innerHTML =
        `<h1 class="plant-title">🌿 バジルの状態</h1>
         <div class="state-msg"></div>`;
      card.querySelector(".state-msg").textContent = msg;
      document.getElementById("footer").innerHTML = "";
    }

    function render(d) {
      const score = d.vitality_score ?? 0;
      const t     = theme(score);
      setBackground(t);

      /* Build static skeleton via innerHTML (no user data here),
         then populate dynamic values via textContent to prevent XSS. */
      const card = document.getElementById("card");
      card.innerHTML = `
        <h1 class="plant-title">🌿 バジルの状態</h1>
        <div class="score-section">
          <div class="score-number" id="score-num"></div>
          <div class="status-chip">
            <span class="status-dot"></span><span id="status-label"></span>
          </div>
        </div>
        <div class="sensors">
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="temp-val"></span><span class="sensor-unit">℃</span>
            </div>
            <div class="sensor-label">温度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="hum-val"></span><span class="sensor-unit">%</span>
            </div>
            <div class="sensor-label">湿度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value" id="water-status"></div>
            <div class="sensor-label">水位</div>
            <div class="sensor-detail">raw: <span id="water-raw"></span></div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value status-value" id="light-status"></div>
            <div class="sensor-label">照度</div>
            <div class="sensor-detail">raw: <span id="light-raw"></span></div>
          </div>
        </div>
        <div class="message" id="msg-box"></div>
        <div class="advice-list" id="advice-list"></div>
      `;

      document.getElementById("score-num").textContent    = score;
      document.getElementById("status-label").textContent = t.label;
      document.getElementById("temp-val").textContent     = fmt(d.temperature);
      document.getElementById("hum-val").textContent      = fmt(d.humidity);
      document.getElementById("msg-box").textContent      = totalAdvice(score);
      document.getElementById("water-status").textContent = sensorStatusLabel("water", d.water_status);
      document.getElementById("water-raw").textContent    = fmtRaw(d.water_raw);
      document.getElementById("light-status").textContent = sensorStatusLabel("light", d.light_status);
      document.getElementById("light-raw").textContent    = fmtRaw(d.light_raw);

      const adviceList = document.getElementById("advice-list");
      adviceList.innerHTML = "";
      generateAdvice(d).forEach(function(item) {
        const box = document.createElement("div");
        box.className = "advice-item";
        const label = document.createElement("span");
        label.className = "advice-label";
        label.textContent = item[0];
        const text = document.createTextNode(item[1]);
        box.append(label, text);
        adviceList.appendChild(box);
      });

      const footer = document.getElementById("footer");
      const strong = document.createElement("strong");
      strong.textContent = toJst(d.created_at);
      footer.innerHTML = "";
      footer.append("最終更新：", strong);
    }

    function renderDemo(mode) {
      render({ ...DEMO_DATA[mode], created_at: new Date().toISOString() });
      const footer = document.getElementById("footer");
      footer.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = "デモモード";
      footer.appendChild(strong);
    }

    function setActiveBtn(mode) {
      document.querySelectorAll(".demo-btn").forEach(function(btn) {
        const isActive = btn.dataset.mode === (mode || "normal");
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
    }

    let liveInterval = null;

    function applyDemoMode(mode) {
      demoMode = mode;
      setActiveBtn(mode);
      if (demoMode) {
        clearInterval(liveInterval);
        liveInterval = null;
        renderDemo(demoMode);
      } else {
        loadData();
        liveInterval = setInterval(loadData, 10_000);
      }
    }

    document.querySelectorAll(".demo-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        applyDemoMode(btn.dataset.mode === "normal" ? null : btn.dataset.mode);
      });
    });

    async function loadData() {
      if (demoMode) return;
      if (!BASE || !KEY) return;
      try {
        const res = await fetch(
          `${BASE}/rest/v1/sensor_logs` +
          `?select=temperature,humidity,water_raw,water_voltage,water_status,light_raw,light_voltage,light_status,vitality_score,message,created_at` +
          `&order=created_at.desc&limit=1`,
          { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { showState("データがありません"); return; }
        render(rows[0]);
      } catch (e) {
        showState("データ取得失敗");
        console.error(e);
      }
    }

    const demoParam = new URLSearchParams(window.location.search).get("demo");
    if (demoParam && Object.hasOwn(DEMO_DATA, demoParam)) {
      applyDemoMode(demoParam);
    } else {
      loadData();
      liveInterval = setInterval(loadData, 10_000);
    }
  </script>
</body>
</html>
