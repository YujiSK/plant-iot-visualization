<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 バジルの状態</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0c4a24;
      --bg2: #166534;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      transition: background 0.7s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Glass card ── */
    .card {
      width: min(400px, 100%);
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 32px 24px 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .plant-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Score ── */
    .score-section {
      margin-bottom: 28px;
    }

    .score-number {
      font-size: clamp(80px, 22vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      padding: 6px 16px 6px 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* ── Sensor tiles ── */
    .sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sensor-tile.pressure-tile {
      grid-column: 1 / -1;
    }

    .sensor-tile {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 12px 14px;
    }

    .sensor-value {
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sensor-unit {
      font-size: clamp(16px, 4.5vw, 21px);
      font-weight: 500;
      opacity: 0.8;
      margin-left: 1px;
    }

    .sensor-label {
      margin-top: 5px;
      font-size: clamp(11px, 3vw, 13px);
      opacity: 0.65;
      letter-spacing: 0.07em;
    }

    /* ── Message ── */
    .message {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      line-height: 1.55;
      opacity: 0.92;
    }

    /* ── Loading / error ── */
    .state-msg {
      font-size: clamp(17px, 5vw, 22px);
      opacity: 0.8;
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    /* ── Demo mode bar ── */
    .demo-bar {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .demo-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .demo-btn.active {
      background: rgba(255, 255, 255, 0.32);
      color: #fff;
      font-weight: 700;
      border-color: rgba(255, 255, 255, 0.65);
    }
  </style>
</head>
<body>

  <main id="card" class="card" aria-live="polite">
    <h1 class="plant-title">🌿 バジルの状態</h1>
    <div class="state-msg">
      <span class="spinner"></span>読み込み中…
    </div>
  </main>

  <div id="demo-bar" class="demo-bar" role="group" aria-label="表示モード切替">
    <button type="button" data-mode="normal" class="demo-btn active" aria-pressed="true">通常</button>
    <button type="button" data-mode="good" class="demo-btn" aria-pressed="false">良好</button>
    <button type="button" data-mode="warning" class="demo-btn" aria-pressed="false">注意</button>
    <button type="button" data-mode="danger" class="demo-btn" aria-pressed="false">要対応</button>
  </div>

  <footer id="footer" class="footer"></footer>

  <script src="config.js"></script>
  <script>
    const BASE = (window.PLANT_CONFIG?.SUPABASE_URL || "").replace(/\/$/, "");
    const KEY  = window.PLANT_CONFIG?.SUPABASE_KEY || "";

    if (!BASE || !KEY) showState("設定が見つかりません");

    const THEMES = {
      good:    { bg1: "#0c4a24", bg2: "#166534", label: "良好"   },
      caution: { bg1: "#451a03", bg2: "#78350f", label: "注意"   },
      alert:   { bg1: "#450a0a", bg2: "#7f1d1d", label: "要対応" },
    };

    const DEMO_DATA = {
      good: {
        temperature: 26.0, humidity: 50.0, pressure: 1013.2,
        vitality_score: 92, message: "安定しています",
      },
      warning: {
        temperature: 30.5, humidity: 38.0, pressure: 1010.6,
        vitality_score: 68, message: "やや注意が必要です",
      },
      danger: {
        temperature: 36.0, humidity: 28.0, pressure: 1008.4,
        vitality_score: 40, message: "乾燥しています",
      },
    };

    let demoMode = null;

    function theme(score) {
      if (score >= 80) return THEMES.good;
      if (score >= 60) return THEMES.caution;
      return THEMES.alert;
    }

    function toJst(utcStr) {
      const s = /Z|[+-]\d{2}:?\d{2}$/.test(utcStr) ? utcStr : utcStr + "Z";
      return new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
    }

    function fmt(v, d = 1) {
      return v != null ? Number(v).toFixed(d) : "--";
    }

    function setBackground(t) {
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
    }

    /* showState: msg is always a hardcoded constant, but use textContent
       to ensure future callers (e.g. error.message) cannot inject HTML. */
    function showState(msg) {
      const card = document.getElementById("card");
      card.innerHTML =
        `<h1 class="plant-title">🌿 バジルの状態</h1>
         <div class="state-msg"></div>`;
      card.querySelector(".state-msg").textContent = msg;
      document.getElementById("footer").innerHTML = "";
    }

    function render(d) {
      const score = d.vitality_score ?? 0;
      const t     = theme(score);
      setBackground(t);

      /* Build static skeleton via innerHTML (no user data here),
         then populate dynamic values via textContent to prevent XSS. */
      const card = document.getElementById("card");
      card.innerHTML = `
        <h1 class="plant-title">🌿 バジルの状態</h1>
        <div class="score-section">
          <div class="score-number" id="score-num"></div>
          <div class="status-chip">
            <span class="status-dot"></span><span id="status-label"></span>
          </div>
        </div>
        <div class="sensors">
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="temp-val"></span><span class="sensor-unit">℃</span>
            </div>
            <div class="sensor-label">温度</div>
          </div>
          <div class="sensor-tile">
            <div class="sensor-value">
              <span id="hum-val"></span><span class="sensor-unit">%</span>
            </div>
            <div class="sensor-label">湿度</div>
          </div>
          <div class=sensor-tile>
            <div class=sensor-value>
              <span id=pressure-val></span><span class=sensor-unit>hPa</span>
            </div>
            <div class=sensor-label>気圧</div>
          </div>
        </div>
        <div class=message id=msg-box></div>
      `;

      document.getElementById("score-num").textContent    = score;
      document.getElementById("status-label").textContent = t.label;
      document.getElementById("temp-val").textContent     = fmt(d.temperature);
      document.getElementById("hum-val").textContent      = fmt(d.humidity);
      document.getElementById("msg-box").textContent      = d.message || "状態不明";
      document.getElementById(String.fromCharCode(112,114,101,115,115,117,114,101,45,118,97,108)).textContent = fmt(d.pressure);

      const footer = document.getElementById("footer");
      const strong = document.createElement("strong");
      strong.textContent = toJst(d.created_at);
      footer.innerHTML = "";
      footer.append("最終更新：", strong);
    }

    function renderDemo(mode) {
      render({ ...DEMO_DATA[mode], created_at: new Date().toISOString() });
      const footer = document.getElementById("footer");
      footer.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = "デモモード";
      footer.appendChild(strong);
    }

    function setActiveBtn(mode) {
      document.querySelectorAll(".demo-btn").forEach(function(btn) {
        const isActive = btn.dataset.mode === (mode || "normal");
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });
    }

    let liveInterval = null;

    function applyDemoMode(mode) {
      demoMode = mode;
      setActiveBtn(mode);
      if (demoMode) {
        clearInterval(liveInterval);
        liveInterval = null;
        renderDemo(demoMode);
      } else {
        loadData();
        liveInterval = setInterval(loadData, 10_000);
      }
    }

    document.querySelectorAll(".demo-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        applyDemoMode(btn.dataset.mode === "normal" ? null : btn.dataset.mode);
      });
    });

    async function loadData() {
      if (demoMode) return;
      if (!BASE || !KEY) return;
      try {
        const res = await fetch(
          `${BASE}/rest/v1/sensor_logs` +
          `?select=temperature,humidity,pressure,vitality_score,message,created_at` +
          `&order=created_at.desc&limit=1`,
          { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        if (!rows.length) { showState("データがありません"); return; }
        render(rows[0]);
      } catch (e) {
        showState("データ取得失敗");
        console.error(e);
      }
    }

    const demoParam = new URLSearchParams(window.location.search).get("demo");
    if (demoParam && Object.hasOwn(DEMO_DATA, demoParam)) {
      applyDemoMode(demoParam);
    } else {
      loadData();
      liveInterval = setInterval(loadData, 10_000);
    }
  </script>
</body>
</html>
